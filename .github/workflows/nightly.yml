name: Nightly

# The whole Lojban corpus in every language, every night and on demand
# (design, "Tests"): pull requests run the core sample everywhere and the
# whole corpus in JavaScript and Rust only.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: The whole corpus in JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The Markdown parser lets a failing case name the lines of the
      # grammar documents that quote its text.
      - name: Install the development dependencies
        working-directory: lib/js
        run: npm ci
      - name: Every corpus case
        working-directory: lib/js
        env:
          GENCMU_CORPUS: full
          # A book chapter takes about 1.5 GB in JavaScript; the runner has 16.
          GENCMU_CORPUS_WORKERS: "3"
        run: node --test test/corpus.test.js

  python:
    name: The whole corpus in Python
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build and install the wheel and test runner
        working-directory: lib/python
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install build
          "$RUNNER_TEMP/build/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl --group test
      - name: Every corpus case
        working-directory: lib/python
        env:
          GENCMU_CORPUS: full
          GENCMU_INSTALLED: "1"
        run: '"$RUNNER_TEMP/installed/bin/python" -m pytest -n 4 -v tests/test_corpus.py'

  go:
    name: The whole corpus in Go
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Every corpus case
        working-directory: lib/go
        env:
          GENCMU_CORPUS: full
          GENCMU_CORPUS_WORKERS: "3"
        run: go test -run TestCorpus -timeout 50m -v ./...

  rust:
    name: The whole corpus in Rust
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Every corpus case
        working-directory: lib/rust
        env:
          GENCMU_CORPUS: full
        run: cargo test --release --test corpus -- --nocapture
