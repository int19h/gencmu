name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playground:
    name: Playground from file:// in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Open index.html from file:// in a headless browser
        run: node tools/smoke-playground.js --browser ${{ matrix.browser }}

  javascript:
    name: JavaScript on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Generated files are up to date
        run: node tools/sync.js --check
      - name: Tests
        working-directory: js
        run: node --test
      - name: The package holds everything it needs
        working-directory: js
        run: npm pack --dry-run 2>&1 | tee pack.txt && grep -q "grammars/compiled.json" pack.txt && grep -q "src/index.js" pack.txt && grep -q "types/index.d.ts" pack.txt

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        working-directory: python
        run: python -m unittest -v
      # The build backend is needed to build the wheel only; the package and
      # its tests use the standard library alone.
      - name: Build the wheel
        working-directory: python
        run: |
          python -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/python" -m pip install build
          "$RUNNER_TEMP/build/bin/python" -m build --outdir "$RUNNER_TEMP/dist"
      - name: The wheel holds everything it needs
        working-directory: python
        run: |
          python -m zipfile -l "$RUNNER_TEMP"/dist/*.whl | tee wheel.txt
          grep -q "gencmu/grammars/compiled.json" wheel.txt
          grep -q "gencmu/grammars/notation/bootstrap.json" wheel.txt
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
          GENCMU_INSTALLED=1 "$RUNNER_TEMP/installed/bin/python" -m unittest

  corpus:
    name: The whole corpus in JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Every corpus case
        working-directory: js
        env:
          GENCMU_CORPUS: full
          # Two workers: a book chapter takes about 4 GB, and the runner has 16.
          GENCMU_CORPUS_WORKERS: "2"
        run: node --test test/corpus.test.js

  types:
    name: JavaScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # TypeScript is a development dependency only: the tests above run
      # without installing it.
      - name: Install the type checker
        working-directory: js
        run: npm ci
      - name: The sources and a client of the package type-check
        working-directory: js
        run: npm run check-types
      - name: The declarations are up to date
        working-directory: js
        run: |
          npm run types
          git diff --exit-code -- types
          test -z "$(git status --porcelain -- types)" || { git status --porcelain -- types; exit 1; }

  rust:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The crate's minimum supported Rust version, and the newest.
        rust: ["1.75", stable]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: The crate holds everything it needs
        run: cargo package
      # The whole Lojban corpus, on each pull request (design, "Tests"):
      # about a minute on a hosted runner's cores, under 2 GB.
      - name: The whole corpus
        if: matrix.rust == 'stable'
        env:
          GENCMU_CORPUS: full
        run: cargo test --release --test corpus -- --nocapture

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest release go/go.mod states, and the current one.
        go: ["1.22", stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Tests
        working-directory: go
        run: go test ./...
      - name: Concurrent parses under the race detector
        working-directory: go
        run: go test -race -run Concurrent ./...
      - name: The module holds everything it needs
        run: |
          # A copy of go/ alone, built in module mode, and a program that
          # requires it and parses with the embedded grammars.
          cp -r go "$RUNNER_TEMP/module"
          (cd "$RUNNER_TEMP/module" && GOFLAGS=-mod=mod go build ./... && go vet ./...)
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          go mod init example.com/consumer
          go mod edit -require=github.com/int19h/gencmu/go@v0.0.0 -replace=github.com/int19h/gencmu/go="$RUNNER_TEMP/module"
          cat > main.go <<'PROGRAM'
          package main

          import (
          	"fmt"
          	"log"

          	gencmu "github.com/int19h/gencmu/go"
          )

          func main() {
          	dialect, err := gencmu.LoadDialect("notation")
          	if err != nil {
          		log.Fatal(err)
          	}
          	result, err := dialect.Parse("text ≔ A [B] ... ;", gencmu.ParseOptions{})
          	if err != nil || !result.OK {
          		log.Fatalf("%v %v", err, result.Error)
          	}
          	fmt.Println(gencmu.Brackets(result, gencmu.BracketOptions{}))
          }
          PROGRAM
          GOFLAGS=-mod=mod go run .
